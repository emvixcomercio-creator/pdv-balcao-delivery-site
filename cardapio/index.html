<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardápio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d1b16">
<!-- 11/11 (Edson: "o cliente colocaria na tela inicial dele"): o cardápio vira um ícone na tela de início do celular. -->
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icone-192.png"><link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cardápio" id="tituloApp">
<style>
  :root { --am: #f2c230; --am2: #ffd95a; --esc: #1d1b16; --cinza: #6b6452; --linha: #ebe6da; --fundo: #f6f4ef; --verde: #1f7a3a; --verm: #b42318; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; background: var(--fundo); color: var(--esc); }
  .caixa { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { background: linear-gradient(135deg, #1d1b16 0%, #2f2a1f 100%); color: #fff; padding: 22px 0 18px; }
  .loja { display: flex; gap: 14px; align-items: center; }
  .logo { width: 58px; height: 58px; border-radius: 16px; background: var(--am); color: var(--esc); font: 800 26px/1 inherit;
          display: grid; place-items: center; flex: none; box-shadow: 0 4px 14px rgba(242,194,48,.35); }
  .loja h1 { margin: 0; font-size: 22px; letter-spacing: -.2px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.1); color: #e8e2cf; }
  .pill.ab { background: rgba(48,160,90,.25); color: #9be7b3; } .pill.fe { background: rgba(220,80,60,.25); color: #ffb4a8; }
  .barra-topo { position: sticky; top: 0; z-index: 3; background: var(--fundo); padding: 12px 0 8px; border-bottom: 1px solid var(--linha); }
  .busca { width: 100%; padding: 12px 14px 12px 40px; border-radius: 12px; border: 1px solid var(--linha); font: inherit; background: #fff
           url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="%236b6452" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="m13 13 4 4"/></svg>') 13px center no-repeat; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { padding: 7px 14px; border-radius: 99px; background: #fff; border: 1px solid var(--linha); white-space: nowrap; cursor: pointer; font-size: 14px; }
  .chip.on { background: var(--esc); color: #fff; border-color: var(--esc); }
  main { padding-bottom: 120px; }
  .aviso { background: #fff4e5; border: 1px solid #f6dfb8; border-radius: 12px; padding: 10px 14px; margin: 14px 0 0; }
  .cat { font-weight: 700; font-size: 18px; margin: 22px 0 10px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 16px; border: 1px solid var(--linha); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 6px 18px rgba(29,27,22,.08); }
  .foto { height: 150px; display: flex; align-items: center; justify-content: center; background: #fff; padding: 10px; overflow: hidden; }
  .foto img { max-width: 100%; max-height: 130px; object-fit: contain; }
  .foto .ic { font-size: 54px; width: 100%; height: 100%; display: grid; place-items: center; border-radius: 12px; }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .nome { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 39px; }
  .preco { font-weight: 800; font-size: 17px; }
  .preco .de { text-decoration: line-through; color: #8a8270; font-weight: 400; font-size: 13px; margin-right: 6px; }
  .cat.promo { color: #b42318; }
  .add { margin-top: auto; border: 0; border-radius: 10px; background: var(--am); padding: 9px; font: 700 14px inherit; cursor: pointer; }
  .add:hover { background: var(--am2); }
  .passo { margin-top: auto; display: flex; align-items: center; justify-content: space-between; background: #f6f3ea; border-radius: 10px; }
  .passo button { width: 38px; height: 38px; border: 0; background: none; font: 700 20px inherit; cursor: pointer; }
  .passo span { font-weight: 800; }
  .barra { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 560px; margin: 0 auto; background: var(--esc); color: #fff; z-index: 4;
           border-radius: 16px; padding: 15px 18px; display: none; justify-content: space-between; align-items: center; font-weight: 700; cursor: pointer;
           box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .barra b { background: var(--am); color: var(--esc); border-radius: 10px; padding: 7px 12px; }
  .vazio { text-align: center; color: var(--cinza); padding: 50px 10px; }
  .tela { position: fixed; inset: 0; background: rgba(20,18,14,.45); display: none; z-index: 5; }
  .tela.on { display: flex; justify-content: center; align-items: stretch; }
  .painel { background: #fff; width: 100%; max-width: 520px; display: flex; flex-direction: column; }
  @media (min-width: 700px) { .tela.on { align-items: center; } .painel { max-height: 92vh; border-radius: 20px; overflow: hidden; } }
  .cab { padding: 16px 18px; border-bottom: 1px solid var(--linha); font-weight: 700; font-size: 17px; display: flex; gap: 10px; align-items: center; }
  .cab button { border: 0; background: #f1ede2; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .corpo { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .linha { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; }
  .tot { border-top: 1px solid var(--linha); margin-top: 6px; padding-top: 8px; font-weight: 800; }
  label { display: block; font-size: 13px; color: var(--cinza); margin: 12px 0 4px; }
  input, select { width: 100%; padding: 11px 12px; border: 1px solid #d8d2c2; border-radius: 10px; font: inherit; background: #fff; }
  .pags { display: flex; gap: 6px; }
  .pag { flex: 1; padding: 11px 4px; border: 1px solid #d8d2c2; border-radius: 10px; text-align: center; cursor: pointer; }
  .pag.on { border-color: var(--esc); background: var(--esc); color: #fff; }
  .enviar { margin: 0 18px 18px; padding: 15px; border: 0; border-radius: 14px; background: var(--am); font: 800 16px inherit; cursor: pointer; }
  .enviar:disabled { opacity: .5; }
  .erro { color: var(--verm); margin-top: 10px; min-height: 20px; }
  .ok { text-align: center; padding: 50px 24px; }
  footer { text-align: center; color: #a39b88; font-size: 12px; padding: 20px 0 30px; }
  @media (max-width: 480px) { .grade { grid-template-columns: repeat(2, 1fr); gap: 10px; } .foto { height: 120px; } .foto img { max-height: 100px; } .loja h1 { font-size: 19px; } }
  .instalar { background: #fff8de; border-bottom: 1px solid #f0dc95; padding: 10px 0; }
  .instalar .caixa { display: flex; gap: 10px; align-items: center; }
  .instalar img { width: 36px; height: 36px; border-radius: 9px; flex: none; }
  .instalar span { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
  .instalar button { border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 700; background: var(--esc); color: #fff; }
  .instalar button.x { background: transparent; color: var(--cinza); padding: 8px 4px; }
  /* 11/11 TAXA POR DISTÂNCIA (prévia aprovada, docs/previa-raio-mapa.html) */
  .loc { width: 100%; border: 0; background: var(--esc); color: #fff; border-radius: 12px; padding: 12px; font: inherit; font-weight: 700; margin-top: 6px; }
  .raioOk { background: #e6f4ea; color: var(--verde); border-radius: 10px; padding: 9px 12px; font-weight: 700; margin-top: 8px; }
  .raioFora { background: #fde8e6; color: var(--verm); border-radius: 10px; padding: 9px 12px; font-weight: 700; margin-top: 8px; }
  .ends { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 2px; }
  .end { border: 1px solid var(--linha); background: #fff; border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .end.on { background: var(--esc); color: #fff; border-color: var(--esc); }
  /* 12/11 (0.2.2) CARDÁPIO NOVO (prévia aprovada, docs/previa-cardapio-novo.html: "execelente"): logo redondo da loja sobre a
     faixa escura, "Mais pedidos", categorias em quadros com foto, barra de baixo Início / Meus pedidos / Carrinho. */
  header { padding: 0; background: var(--fundo); color: var(--esc); }
  .faixaTopo { height: 78px; background: linear-gradient(135deg, #1d1b16 0%, #3a3222 100%); }
  .topoLoja { background: #fff; border-radius: 24px 24px 0 0; margin-top: -30px; padding: 0 16px 14px; text-align: center; position: relative; }
  .topoLoja .logo { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; margin: -42px auto 6px; font-size: 34px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .topoLoja .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .topoLoja h1 { margin: 0; font-size: 20px; }
  .topoLoja .pills { justify-content: center; }
  .topoLoja .pill { background: #f1ede2; color: var(--cinza); } .topoLoja .pill.ab { background: #e6f4ea; color: var(--verde); font-weight: 700; } .topoLoja .pill.fe { background: #fde8e6; color: var(--verm); font-weight: 700; }
  .secao { font-weight: 800; font-size: 17px; margin: 20px 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .secao small { font-weight: 400; color: var(--cinza); font-size: 12px; }
  .carrossel { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; }
  .carrossel::-webkit-scrollbar { display: none; }
  .mini { flex: none; width: 138px; background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 8px; }
  .mini .f { height: 96px; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #fff; }
  .mini .f img { max-width: 100%; max-height: 90px; object-fit: contain; } .mini .f .ic { font-size: 44px; width: 100%; height: 100%; display: grid; place-items: center; }
  .mini .mais { position: absolute; right: 4px; bottom: 4px; width: 34px; height: 34px; border: 0; border-radius: 10px; background: var(--am); font-family: inherit; font-size: 22px; font-weight: 800; line-height: 34px; padding: 0; cursor: pointer; }
  .mini .qt { position: absolute; right: 4px; bottom: 4px; min-width: 34px; height: 34px; border-radius: 10px; background: var(--esc); color: #fff; font-size: 15px; font-weight: 800; line-height: 34px; text-align: center; padding: 0 6px; cursor: pointer; }
  .mini .n { font-size: 12.5px; margin-top: 6px; height: 34px; overflow: hidden; line-height: 1.35; } .mini .p { font-weight: 800; }
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (min-width: 700px) { .cats { grid-template-columns: repeat(4, 1fr); } }
  .cq { height: 108px; border-radius: 16px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 0; padding: 0; font: inherit; }
  .cq img { max-width: 80%; max-height: 92px; object-fit: contain; opacity: .9; } .cq .e { font-size: 56px; opacity: .6; }
  .cq b { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 15px; letter-spacing: .3px; text-transform: uppercase; text-align: center; padding: 0 8px;
          text-shadow: 0 2px 6px rgba(0,0,0,.55); background: rgba(0,0,0,.26); }
  .cq .tagP { position: absolute; left: 0; top: 10px; background: var(--verm); color: #fff; font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 0 6px 6px 0; z-index: 1; }
  .barra { display: none !important; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: #fff; border-top: 1px solid var(--linha); display: flex; padding: 6px 0 calc(8px + env(safe-area-inset-bottom)); }
  .nav button { flex: 1; border: 0; background: none; font: inherit; font-size: 12px; color: var(--cinza); cursor: pointer; padding: 4px 0; }
  .nav button i { display: block; font-style: normal; font-size: 21px; line-height: 1.2; }
  .nav button.on { color: var(--esc); font-weight: 800; }
  .nav .q { background: var(--am); color: var(--esc); border-radius: 99px; padding: 0 6px; font-size: 11px; font-weight: 800; margin-left: 2px; }
  .nav .tt { display: block; font-size: 11px; font-weight: 700; color: var(--esc); }
  .agora { background: #fff; border-radius: 16px; border: 2px solid var(--am); padding: 12px 14px; margin-bottom: 12px; }
  .trilho { height: 6px; background: #eee6cf; border-radius: 9px; margin-top: 10px; } .trilho div { height: 100%; background: var(--verde); border-radius: 9px; transition: width .4s; }
  .passos { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11.5px; color: var(--cinza); text-align: center; } .passos span { flex: 1; } .passos .feito { color: var(--verde); font-weight: 800; }
  .ped { background: #fff; border: 1px solid var(--linha); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .ped .l1 { display: flex; justify-content: space-between; font-size: 13px; color: var(--cinza); } .ped .it { margin: 6px 0 10px; font-size: 14px; }
  .ped .l2 { display: flex; justify-content: space-between; align-items: center; } .ped .l2 b { font-size: 16px; }
  .denovo { border: 0; background: var(--esc); color: #fff; border-radius: 10px; padding: 9px 14px; font: 700 14px inherit; cursor: pointer; }
</style></head><body>
<header><div class="faixaTopo"></div><div class="caixa"><div class="topoLoja"><div class="logo" id="logo">🍺</div>
  <h1 id="nome">Carregando…</h1><div class="pills" id="pills"></div></div></div></header>
<div class="instalar" id="instalar" hidden><div class="caixa"><img src="icone-192.png" alt=""><span id="instalarTexto">Pôr o cardápio na tela inicial do celular</span><button id="instalarBt">Pôr</button><button class="x" id="instalarNao" aria-label="Fechar">✕</button></div></div>
<div class="barra-topo"><div class="caixa"><input class="busca" placeholder="Buscar bebida..." id="busca"><div class="chips" id="chips"></div></div></div>
<main class="caixa" id="lista"><div class="vazio">Carregando o cardápio…</div></main>
<footer>Pedido feito pelo PDV Balcão e Delivery</footer>
<div class="barra" id="barra"><span id="bQtd"></span><b>Ver carrinho · <span id="bTot"></span></b></div>
<nav class="nav" id="nav"><button class="on" id="nInicio"><i>🏠</i>Início</button><button id="nPedidos"><i>🧾</i>Meus pedidos</button><button id="nCarr"><i>🛒</i>Carrinho<span class="q" id="nQ" hidden></span><span class="tt" id="nT"></span></button></nav>
<div class="tela" id="meus"><div class="painel">
  <div class="cab"><button onclick="ir('')" aria-label="Voltar">‹</button>Meus pedidos</div>
  <div class="corpo" id="meusCorpo"></div>
</div></div>

<div class="tela" id="carrinho"><div class="painel">
  <div class="cab"><button onclick="ir('')" aria-label="Voltar">‹</button>Seu pedido</div>
  <div class="corpo">
    <div id="itens"></div>
    <label>Seu nome</label><input id="fNome" autocomplete="name">
    <label>Celular com DDD (WhatsApp)</label><input id="fTel" inputmode="tel" autocomplete="tel">
    <label>Endereço (rua, número, complemento)</label><div class="ends" id="ends"></div><input id="fEnd" autocomplete="street-address">
    <label>Ponto de referência</label><input id="fRef">
    <div id="raioBox" hidden><div id="raioMsg"></div><button class="loc" id="bLoc" type="button" hidden>📍 Usar minha localização</button>
      </div>
    <!-- 12/11 (Edson: "bairro se mora, não se escolhe"): o cliente DIGITA o bairro; a lista da loja só sugere. Fora da lista:
         pede igual e a loja confirma a taxa ("a loja só divulga na área de entrega dela"). -->
    <div id="bairroBox"><label id="bairroTit">Bairro</label><input id="fBairro" list="bairrosL" autocomplete="address-level3"><datalist id="bairrosL"></datalist><div id="bairroMsg"></div></div>
    <label>Pagamento na entrega</label>
    <div class="pags" id="pags"><div class="pag on" data-p="pix">Pix</div><div class="pag" data-p="cartao">Cartão</div><div class="pag" data-p="dinheiro">Dinheiro</div></div>
    <div id="trocoBox" style="display:none"><label>Troco para quanto? (deixe vazio se não precisar)</label><input id="fTroco" inputmode="decimal" placeholder="Ex.: 100"></div>
    <label>Observação</label><input id="fObs" placeholder="Ex.: bem gelada">
    <div id="resumo"></div>
    <div class="erro" id="erro"></div>
  </div>
  <button class="enviar" id="bEnviar">Fazer pedido</button>
</div></div>

<div class="tela" id="feito"><div class="painel"><div class="ok"><div style="font-size:60px">✅</div><h2>Pedido enviado!</h2>
  <p id="feitoTxt"></p><p style="color:#6b6452">A loja confirma e o pagamento é feito na entrega.</p>
  <button class="enviar" style="margin:10px 0 0;width:100%" onclick="ir('meus')">Acompanhar o pedido</button>
  <button class="enviar" style="margin:10px 0 0;width:100%;background:#f1ede2" onclick="location.reload()">Fazer outro pedido</button></div></div></div>

<script>
  const Q = new URLSearchParams(location.search);
  const API = Q.get('api') || 'https://suporte-entrega.onrender.com';
  let ultimaLoja = ''; try { ultimaLoja = localStorage.getItem('ultimaLoja') || ''; } catch (_) {}
  if (!Q.get('l') && /^[a-z0-9-]+$/.test(ultimaLoja)) { location.replace('?l=' + ultimaLoja); }
  const SLUG = (Q.get('l') || '').replace(/[^a-z0-9-]/g, '');
  const $ = (i) => document.getElementById(i);
  const r = (c) => 'R$ ' + (c / 100).toFixed(2).replace('.', ',');
  const esc = (s) => String(s).replace(/[&<>"']/g, (x) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]));
  const semAc = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  // Categoria pelo nome (Cervejas, Drinks e ice, Destilados...); a do iFood (p.k) só quando o nome não diz. Ícone e cor pelo tipo.
  const TIPOS = [['Snacks e doces', '🍫', '#f4ece2', /chocolate|\bbala|halls|chiclete|salgadinho|doritos|ruffles|elma chips|batata|chips|amendoim|biscoito|bolacha|oreo|club social|wafer|bombom|trident|mentos/],
    ['Cervejas', '🍺', '#fdf0d2', /cerveja|chopp|heineken|brahma|skol|spaten|stella|original|amstel|budweiser|corona|antarctica|itaipava|eisenbahn|imperio|beck|devassa|petra|bohemia/],
    ['Drinks e ice', '🍹', '#fde7ef', /\bice\b|beats|xeque|cabare|drink|caipi|batida/],
    ['Destilados', '🥃', '#efe7dc', /vodka|\bgin\b|whisk|cacha|aguardente|pinga|pitu|barreiro|\brum\b|tequila|conhaque|licor|absolut|smirnoff|tanqueray|johnnie|jack daniel|campari|aperol|destilad/],
    ['Vinhos', '🍷', '#f6e3e8', /vinho|espumante|sangria/], ['Energéticos', '⚡', '#e2ecf6', /energ|red bull|monster|fusion|\btnt\b/],
    ['Refrigerantes', '🥤', '#fbe3e3', /refri|coca|guaran|pepsi|fanta|sprite|sukita|soda|tonica|h2oh|schweppes|kuat/],
    ['Águas e sucos', '💧', '#e3f1fb', /^agua|\bagua\b|suco|del valle|\bcha\b|mate|isoton|gatorade|powerade/],
    ['Gelo e carvão', '🧊', '#eaf4fb', /gelo|carvao/]];
  const tipoDe = (p) => { const n = semAc(p.n); return TIPOS.find((t) => t[3].test(n)) || ['Outros', '🛒', '#f1ede2']; };
  let D = null, cat = 'Todos', pag = 'pix', bairroSalvo = '';
  let carr = {}; try { carr = JSON.parse(localStorage.getItem('carr-' + SLUG) || '{}'); } catch (_) {}
  const guardar = () => { try { localStorage.setItem('carr-' + SLUG, JSON.stringify(carr)); } catch (_) {} };

  async function carregar() {
    if (!SLUG) { $('lista').innerHTML = '<div class="vazio">Link incompleto. Peça o link do cardápio à loja.</div>'; $('nome').textContent = 'Cardápio'; return; }
    try {
      const res = await fetch(API + '/v1/cardapio/' + SLUG);
      if (res.status === 404) throw new Error('Cardápio não encontrado. Peça o link certo à loja.');
      if (!res.ok) throw new Error('Não deu para abrir o cardápio agora. Tente de novo em instantes.');
      D = await res.json();
    } catch (e) { $('lista').innerHTML = `<div class="vazio">${esc(e.message || 'Sem internet? Tente de novo.')}</div>`; $('nome').textContent = 'Cardápio'; return; }
    document.title = D.nome + ' · Cardápio';
    try { localStorage.setItem('ultimaLoja', SLUG); } catch (_) {}
    if ($('tituloApp')) $('tituloApp').setAttribute('content', D.nome.slice(0, 30));
    oferecerInstalar();
    $('nome').textContent = D.nome;
    $('logo').textContent = (D.nome.trim()[0] || '🍺').toUpperCase();
    if (D.logo) { const im = new Image(); im.alt = ''; im.onload = () => { $('logo').textContent = ''; $('logo').appendChild(im); }; im.src = D.logo; }
    $('pills').innerHTML = (D.aberto ? '<span class="pill ab">● Aberto</span>' : '<span class="pill fe">● Fechado agora</span>')

      const k = PASSO[agora.sit || 'enviado'] || 0;
      h += `<div class="agora"><div style="display:flex;justify-content:space-between"><b>Pedido de agora · nº ${agora.numero}</b><span style="color:var(--cinza);font-size:13px">${new Date(agora.t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span></div>
        <div class="trilho"><div style="width:${[8, 25, 50, 75, 100][k]}%"></div></div>
        <div class="passos"><span class="${k >= 1 ? 'feito' : ''}">${k >= 1 ? '✓ ' : ''}Recebido</span><span class="${k >= 2 ? 'feito' : ''}">${k >= 2 ? '✓ ' : ''}Aceito</span><span class="${k >= 3 ? 'feito' : ''}">🛵 Saiu</span><span class="${k >= 4 ? 'feito' : ''}">Entregue</span></div>
        <div class="it" style="margin-top:8px;font-size:13px;color:var(--cinza)">${itensTxt(agora)} · ${r(agora.total)}</div></div>`;
    }
    const outros = l.filter((p) => p !== agora);
    if (outros.length) h += `<div class="secao" style="margin-top:6px">${agora ? 'Anteriores' : 'Seus pedidos'}</div>`;
    h += outros.map((p) => `<div class="ped"><div class="l1"><span>${dataBr(p.t)} · nº ${p.numero}</span><span>${NOME_SIT[p.sit] || ''}${p.sit === 'recusado' && p.motivo ? ': ' + esc(p.motivo) : ''}</span></div>
      <div class="it">${itensTxt(p)}</div><div class="l2"><b>${r(p.total)}</b>${D && D.aberto ? `<button class="denovo" data-denovo="${esc(p.id)}">↻ Pedir de novo</button>` : ''}</div></div>`).join('');
    $('meusCorpo').innerHTML = h + '<div id="meusMsg" class="erro"></div>';
    for (const b of $('meusCorpo').querySelectorAll('[data-denovo]')) b.onclick = () => pedirDeNovo(l.find((p) => p.id === b.dataset.denovo));
  }
  // "Pedir de novo": os mesmos itens no carrinho, com o preço de hoje; o que saiu do cardápio fica de fora (e diz qual).
  function pedirDeNovo(p) {
    if (!p || !D) return;
    const pc = new Map(D.produtos.map((x) => [x.c, x])), fora = [], novo = {};
    for (const i of p.itens) { if (pc.has(i.c)) novo[i.c] = Math.min(99, (novo[i.c] || 0) + i.q); else fora.push(i.n); }
    if (!Object.keys(novo).length) { $('meusMsg').textContent = 'Esses produtos não estão no cardápio agora.'; return; }
    carr = novo; // o carrinho fica igual ao pedido (apertar duas vezes não dobra)
    guardar(); desenhar();
    ir('carrinho');
    if (fora.length) $('itens').insertAdjacentHTML('afterbegin', `<div class="aviso" style="margin:0 0 8px">Fora do cardápio agora: ${esc(fora.join(', '))}</div>`);
  }
  // Quem já pediu antes (só o "cli-"): o endereço dele vira o primeiro da lista.
  if (!lerEnds().length) { try { const c = JSON.parse(localStorage.getItem('cli-' + SLUG) || 'null'); if (c && c.e) guardarEnd({ e: c.e, r: c.r || '', b: c.b || '' }); } catch (_) {} }
</script>
